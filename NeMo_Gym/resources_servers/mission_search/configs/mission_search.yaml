# Resources server: owns this environment's task verification (verify()) and reward.
# Datasets are declared here — the resources server defines what the rows mean and how
# they are scored. Which agent runs them is chosen at run time.
mission_search_resources_server:          # instance name — how agents/CLI refer to this server
  resources_servers:                    # server type: resources_servers | responses_api_agents | responses_api_models
    mission_search:                      # implementation directory under resources_servers/
      entrypoint: app.py                # server entry module
      domain: other                     # task domain; change to the closest supported domain
      verified: false                   # set true once the benchmark has been baselined and reviewed
      datasets:
      - name: train
        type: train
        jsonl_fpath: resources_servers/mission_search/data/train.jsonl
        num_repeats: 1
        license: Apache 2.0
        # To fetch this split from a registry, add a source: block.
      - name: validation
        type: validation
        jsonl_fpath: resources_servers/mission_search/data/validation.jsonl
        num_repeats: 1
        license: Apache 2.0
      - name: example
        type: example
        jsonl_fpath: resources_servers/mission_search/data/example.jsonl
        num_repeats: 1

# Pair the server with the default agent.
mission_search_simple_agent:             # pass this instance as --agent to gym eval run
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: mission_search_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
