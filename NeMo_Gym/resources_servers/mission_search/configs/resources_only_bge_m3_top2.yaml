# Same as resources_only_bge_m3.yaml, with 2 chunks for each search (the number that runs 1 and 2 trained with). Only top_k differs.
# Start:  cd NeMo_Gym && resources_servers/mission_search/.venv/bin/ng_run "+config_paths=[resources_servers/mission_search/configs/resources_only_bge_m3_top2.yaml]" +skip_venv_if_present=true
mission_search_resources_server:
  resources_servers:
    mission_search:
      entrypoint: app.py
      domain: other
      verified: false
      retriever: bge_m3
      top_k: 2
