<text x="145.0" y="311.9" class="val" text-anchor="middle">0.16 ± 0.03</text>
<text x="145.0" y="402.0" class="lab" text-anchor="middle">Base model</text>
<text x="145.0" y="419.0" class="sub" text-anchor="middle">untrained</text>
<path class="c1" d="M235.0,380 V206.2 Q235.0,202.2 239.0,202.2 H311.0 Q315.0,202.2 315.0,206.2 V380 Z"/>
<path class="err" d="M275.0,190.3 V214.2 M267.0,190.3 H283.0 M267.0,214.2 H283.0"/>
<text x="275.0" y="181.3" class="val" text-anchor="middle">0.57 ± 0.04</text>
<text x="275.0" y="402.0" class="lab" text-anchor="middle">Run 2</text>
<text x="275.0" y="419.0" class="sub" text-anchor="middle">retrieval reward</text>
<path class="c2" d="M365.0,380 V209.7 Q365.0,205.7 369.0,205.7 H441.0 Q445.0,205.7 445.0,209.7 V380 Z"/>
<path class="err" d="M405.0,193.8 V217.6 M397.0,193.8 H413.0 M397.0,217.6 H413.0"/>
<text x="405.0" y="184.8" class="val" text-anchor="middle">0.56 ± 0.04</text>
<text x="405.0" y="402.0" class="lab" text-anchor="middle">Run 3</text>
<text x="405.0" y="419.0" class="sub" text-anchor="middle">BGE-M3 + credit</text>
<text x="275.0" y="448.0" class="sub" text-anchor="middle">Run 3 minus run 2: −0.011 ± 0.019 (no difference)</text>
<text x="275.0" y="465.0" class="sub" text-anchor="middle">Run 3 minus base: +0.397 ± 0.041</text>
<line x1="550" x2="930" y1="380.0" y2="380.0" class="axis"/>
