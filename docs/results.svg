<polyline class="l2" points="574.7,317.8 622.2,244.6 669.7,246.6 717.2,264.7 764.7,214.3 812.2,240.1 859.7,257.0 907.2,235.9"/>
<circle class="m2" cx="574.7" cy="317.8" r="4.5"/>
