<circle class="c1" cx="574" cy="148" r="5"/>
<text x="585.0" y="152.0" class="sub" text-anchor="start">Run 2</text>
<circle class="c2" cx="664" cy="148" r="5"/>
<text x="675.0" y="152.0" class="sub" text-anchor="start">Run 3</text>
<text x="40.0" y="498.0" class="sub" text-anchor="start">Left: the three models on the same questions, scored by the old rule only (the semantic credit is not counted here).</text>
<text x="40.0" y="515.0" class="sub" text-anchor="start">Run 2: old retriever in training, plus a retrieval reward. Run 3: BGE-M3 retriever, semantic credit, de-duplicated training data.</text>
<text x="40.0" y="532.0" class="sub" text-anchor="start">Right: reward of the training rollouts (temperature 0.9, same old rule), mean of each 25 steps.</text>
<text x="40.0" y="549.0" class="sub" text-anchor="start">The two runs saw the questions in a different order, so the curves show a trend, not a test.</text>
</svg>
